<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdf-ops System Diagrams</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1c2430;
    --muted: #5b6572;
    --line: #d9dee5;
    --accent: #0f766e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151c;
      --panel: #161d26;
      --ink: #e8edf3;
      --muted: #9aa6b4;
      --line: #2a3441;
      --accent: #2dd4bf;
    }
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav a {
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    text-decoration: none;
  }
  nav a:hover { color: var(--ink); }
  nav a.active {
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  main { flex: 1; min-height: 0; }
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--panel);
  }
  .hint { color: var(--muted); margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>pdf-ops diagrams</h1>
  <nav id="tabs">
    <a href="#architecture" data-page="pdf-ops-architecture.html">Architecture</a>
    <a href="#lifecycle" data-page="retry-machine.html">Run lifecycle</a>
    <a href="#extract" data-page="extract-trust.html">Extract data flow</a>
    <a href="#passwords" data-page="password-flow.html">Password sequence</a>
  </nav>
  <span class="hint">keys 1-4 switch</span>
</header>
<main><iframe id="frame" title="diagram"></iframe></main>
<script>
  var tabs = Array.prototype.slice.call(document.querySelectorAll("#tabs a"));
  var frame = document.getElementById("frame");

  function activate(hash) {
    var tab = tabs.filter(function (t) { return t.getAttribute("href") === hash; })[0] || tabs[0];
    tabs.forEach(function (t) { t.classList.toggle("active", t === tab); });
    var page = tab.getAttribute("data-page");
    if (frame.getAttribute("src") !== page) frame.setAttribute("src", page);
  }

  window.addEventListener("hashchange", function () { activate(location.hash); });
  document.addEventListener("keydown", function (event) {
    var index = "1234".indexOf(event.key);
    if (index >= 0 && tabs[index]) location.hash = tabs[index].getAttribute("href");
  });
  activate(location.hash);
</script>
</body>
</html>
